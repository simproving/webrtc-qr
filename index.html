<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebRTC QR Signaling</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    video, canvas { width: 300px; height: auto; }
    #qrCanvas { border: 1px solid black; }
  </style>
</head>
<body>
  <h2>WebRTC via QR Code</h2>
  <button onclick="createOffer()">Create Offer</button>
  <button onclick="createAnswer()">Create Answer</button>
  <button onclick="startScan()">Scan QR</button>
  <br><br>

  <div id="qrcode"></div>
  <video id="video" autoplay playsinline></video>
  <canvas id="qrCanvas" style="display: none;"></canvas>

  <script>
    const peer = new RTCPeerConnection();
    const qrcodeDiv = document.getElementById('qrcode');
    const video = document.getElementById('video');
    const qrCanvas = document.getElementById('qrCanvas');
    const qrCtx = qrCanvas.getContext('2d');

    let dataChannel;

    function log(...args) {
      console.log('[LOG]', ...args);
    }

    function waitForICEGatheringComplete(pc) {
      return new Promise(resolve => {
        if (pc.iceGatheringState === 'complete') {
          resolve();
        } else {
          pc.addEventListener('icegatheringstatechange', function check() {
            if (pc.iceGatheringState === 'complete') {
              pc.removeEventListener('icegatheringstatechange', check);
              resolve();
            }
          });
        }
      });
    }

    peer.ondatachannel = (event) => {
      const channel = event.channel;
      channel.onmessage = (e) => log("Received:", e.data);
      channel.onopen = () => {
        log("Data channel open from remote side.");
        channel.send("Hello from Answer!");
      };
    };

    async function createOffer() {
      log("Creating offer...");
      dataChannel = peer.createDataChannel("chat");
      dataChannel.onopen = () => {
        log("Data channel open. Sending message...");
        dataChannel.send("Hello from Offer!");
      };
      dataChannel.onmessage = (e) => log("Received:", e.data);

      const offer = await peer.createOffer();
      await peer.setLocalDescription(offer);

      await waitForICEGatheringComplete(peer);
      log("ICE gathering complete for offer");

      const offerStr = JSON.stringify(peer.localDescription);
      QRCode.toCanvas(qrCanvas, offerStr, error => {
        if (error) {
          console.error("QR Code error", error);
          return;
        }
        qrCanvas.style.display = 'block';
        qrcodeDiv.innerHTML = '';
        qrcodeDiv.appendChild(qrCanvas);
        log("Offer QR code displayed");
      });
    }

    async function createAnswer() {
      log("Waiting to scan offer QR...");
      startScan(async (desc) => {
        log("Got offer from QR:", desc);
        await peer.setRemoteDescription(desc);
        const answer = await peer.createAnswer();
        await peer.setLocalDescription(answer);

        await waitForICEGatheringComplete(peer);
        log("ICE gathering complete for answer");

        const answerStr = JSON.stringify(peer.localDescription);
        QRCode.toCanvas(qrCanvas, answerStr, error => {
          if (error) {
            console.error("QR Code error", error);
            return;
          }
          qrCanvas.style.display = 'block';
          qrcodeDiv.innerHTML = '';
          qrcodeDiv.appendChild(qrCanvas);
          log("Answer QR code displayed");
        });
      });
    }

    function startScan(callback) {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream => {
        video.srcObject = stream;
        const scan = () => {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            qrCanvas.width = video.videoWidth;
            qrCanvas.height = video.videoHeight;
            qrCtx.drawImage(video, 0, 0, qrCanvas.width, qrCanvas.height);
            const imageData = qrCtx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
            const code = jsQR(imageData.data, qrCanvas.width, qrCanvas.height);
            if (code) {
              log("QR code scanned:", code.data);
              stream.getTracks().forEach(track => track.stop());
              video.srcObject = null;
              try {
                const desc = JSON.parse(code.data);
                callback(desc);
              } catch (e) {
                console.error("Failed to parse QR code data", e);
              }
              return;
            }
          }
          requestAnimationFrame(scan);
        };
        scan();
      }).catch(err => {
        console.error("Camera access error", err);
      });
    }
  </script>
</body>
</html>
